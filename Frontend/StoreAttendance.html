<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Rota: store attendance</title>
      <link rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%92%3C/text%3E%3C/svg%3E">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap"
            rel="stylesheet">
      <style>
            :root {
                  --bg: #E9ECE6;
                  --surface: #F7F8F4;
                  --raise: #FFFFFF;
                  --ink: #16252A;
                  --ink-2: #4A5B60;
                  --line: #CBD3CB;
                  --line-2: #E1E6DF;
                  --side: #14211F;
                  --side-ink: #DCE6E2;
                  --side-mute: #8FA39D;
                  --signal: #F2C230;
                  --signal-ink: #1A1500;
                  --primary: #16252A;
                  --primary-ink: #F7F8F4;
                  --ok: #1F7A4D;
                  --ok-bg: #D8EFE0;
                  --warn: #7A5000;
                  --warn-bg: #F7E9BE;
                  --bad: #B0352A;
                  --bad-bg: #F6DAD5;
                  --s-am: #D9971A;
                  --s-pm: #3B4BA6;
                  --s-full: #17806D;
                  --s-bw: #8E4E85;
                  --s-ann: #4A8FC0;
                  --s-sl: #C4553B;
                  --s-off: #6B7280;
                  --focus: #2F6BFF;
                  --shadow: #16252A;
                  color-scheme: light;
            }

            @media (prefers-color-scheme: dark) {
                  :root:not([data-theme="light"]) {
                        --bg: #0E1517;
                        --surface: #152023;
                        --raise: #1B292D;
                        --ink: #E4ECE9;
                        --ink-2: #9DB0AB;
                        --line: #2E4044;
                        --line-2: #22322F;
                        --side: #0A100F;
                        --side-ink: #DCE6E2;
                        --side-mute: #8FA39D;
                        --primary: #E4ECE9;
                        --primary-ink: #0E1517;
                        --ok: #6FD39A;
                        --ok-bg: #163526;
                        --warn: #F0C567;
                        --warn-bg: #3A2E0E;
                        --bad: #F09088;
                        --bad-bg: #40201C;
                        --s-am: #E8B84A;
                        --s-pm: #7C8CE6;
                        --s-full: #3FB7A0;
                        --s-bw: #C283B8;
                        --s-ann: #78B4E0;
                        --s-sl: #E58A72;
                        --s-off: #9CA3AF;
                        --focus: #7AA2FF;
                        --shadow: #000;
                        color-scheme: dark;
                  }
            }

            :root[data-theme="dark"] {
                  --bg: #0E1517;
                  --surface: #152023;
                  --raise: #1B292D;
                  --ink: #E4ECE9;
                  --ink-2: #9DB0AB;
                  --line: #2E4044;
                  --line-2: #22322F;
                  --side: #0A100F;
                  --side-ink: #DCE6E2;
                  --side-mute: #8FA39D;
                  --primary: #E4ECE9;
                  --primary-ink: #0E1517;
                  --ok: #6FD39A;
                  --ok-bg: #163526;
                  --warn: #F0C567;
                  --warn-bg: #3A2E0E;
                  --bad: #F09088;
                  --bad-bg: #40201C;
                  --s-am: #E8B84A;
                  --s-pm: #7C8CE6;
                  --s-full: #3FB7A0;
                  --s-bw: #C283B8;
                  --s-ann: #78B4E0;
                  --s-sl: #E58A72;
                  --s-off: #9CA3AF;
                  --focus: #7AA2FF;
                  --shadow: #000;
                  color-scheme: dark;
            }

            * {
                  box-sizing: border-box
            }

            html {
                  -webkit-text-size-adjust: 100%
            }

            body {
                  margin: 0;
                  background: var(--bg);
                  color: var(--ink);
                  font: 15px/1.5 "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                  font-variant-numeric: tabular-nums
            }

            h1,
            h2,
            h3 {
                  font-family: "Bricolage Grotesque", "Public Sans", system-ui, sans-serif;
                  line-height: 1.15;
                  margin: 0;
                  letter-spacing: -.01em
            }

            h1 {
                  font-size: clamp(1.6rem, 3vw, 2.25rem);
                  font-weight: 700
            }

            h2 {
                  font-size: 1.2rem;
                  font-weight: 700
            }

            h3 {
                  font-size: 1rem;
                  font-weight: 700
            }

            p {
                  margin: 0
            }

            .muted {
                  color: var(--ink-2)
            }

            .pad {
                  padding: 18px
            }

            button,
            input,
            select,
            textarea {
                  font: inherit;
                  color: inherit
            }

            :focus-visible {
                  outline: 3px solid var(--focus);
                  outline-offset: 2px
            }

            @media (prefers-reduced-motion:reduce) {
                  * {
                        transition: none !important;
                        animation: none !important
                  }
            }

            /* shell */
            .app {
                  display: grid;
                  grid-template-columns: 248px minmax(0, 1fr);
                  min-height: 100vh
            }

            .side {
                  background: var(--side);
                  color: var(--side-ink);
                  padding: 20px 14px;
                  position: sticky;
                  top: 0;
                  height: 100vh;
                  display: flex;
                  flex-direction: column;
                  gap: 16px;
                  overflow: auto
            }

            .side-top {
                  display: flex;
                  align-items: center;
                  justify-content: space-between
            }

            .brand {
                  font-family: "Bricolage Grotesque", system-ui, sans-serif;
                  font-weight: 800;
                  font-size: 1.55rem;
                  padding: 0 8px;
                  display: flex;
                  align-items: center;
                  gap: 10px;
                  letter-spacing: -.02em
            }

            .brand i {
                  width: 14px;
                  height: 14px;
                  background: var(--signal);
                  border-radius: 50%;
                  display: inline-block
            }

            .collapse {
                  display: flex;
                  flex-direction: column;
                  gap: 16px;
                  flex: 1;
                  min-height: 0
            }

            .menu-btn {
                  display: none;
                  background: transparent;
                  border: 1.5px solid #ffffff33;
                  color: var(--side-ink);
                  border-radius: 8px;
                  padding: 6px 12px;
                  cursor: pointer;
                  font-weight: 600
            }

            .who {
                  padding: 12px 8px;
                  border-top: 1px solid #ffffff1f;
                  border-bottom: 1px solid #ffffff1f
            }

            .who b {
                  display: block;
                  font-weight: 600
            }

            .who span {
                  color: var(--side-mute);
                  font-size: .86rem
            }

            .nav {
                  display: flex;
                  flex-direction: column;
                  gap: 2px
            }

            .nav a {
                  display: block;
                  padding: 9px 12px;
                  border-radius: 6px;
                  color: var(--side-ink);
                  text-decoration: none;
                  border-left: 4px solid transparent;
                  cursor: pointer
            }

            .nav a:hover {
                  background: #ffffff0d
            }

            .nav a[aria-current="page"] {
                  background: #ffffff14;
                  border-left-color: var(--signal);
                  font-weight: 600
            }

            .nav hr {
                  border: 0;
                  border-top: 1px solid #ffffff1f;
                  margin: 8px 8px
            }

            .foot {
                  margin-top: auto;
                  display: flex;
                  flex-direction: column;
                  gap: 8px
            }

            .foot select {
                  background: #ffffff10;
                  border-color: #ffffff26;
                  color: var(--side-ink)
            }

            .foot select option {
                  color: #16252A
            }

            .foot .btn {
                  background: transparent;
                  border-color: #ffffff33;
                  color: var(--side-ink)
            }

            .foot .btn:hover {
                  border-color: var(--side-ink)
            }

            .foot small {
                  color: var(--side-mute)
            }

            .main {
                  padding: 28px clamp(16px, 4vw, 44px) 64px;
                  max-width: 1240px;
                  width: 100%
            }

            .page-head {
                  display: flex;
                  flex-wrap: wrap;
                  align-items: flex-end;
                  justify-content: space-between;
                  gap: 12px;
                  margin-bottom: 22px
            }

            .page-head p {
                  margin-top: 4px
            }

            .row {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 10px;
                  align-items: center
            }

            .stack {
                  display: flex;
                  flex-direction: column;
                  gap: 14px
            }

            .boot {
                  padding: 40px;
                  text-align: center;
                  color: var(--ink-2)
            }

            @media (max-width:860px) {
                  .app {
                        grid-template-columns: 1fr
                  }

                  .side {
                        position: static;
                        height: auto;
                        padding: 12px 14px
                  }

                  .menu-btn {
                        display: inline-flex
                  }

                  .collapse {
                        display: none;
                        margin-top: 8px
                  }

                  .side.open .collapse {
                        display: flex
                  }
            }

            /* controls */
            .btn {
                  display: inline-flex;
                  align-items: center;
                  justify-content: center;
                  gap: 6px;
                  border: 1.5px solid var(--line);
                  background: var(--raise);
                  color: var(--ink);
                  padding: 8px 14px;
                  border-radius: 8px;
                  font-weight: 600;
                  cursor: pointer;
                  min-height: 38px;
                  text-decoration: none
            }

            .btn:hover {
                  border-color: var(--ink-2)
            }

            .btn.primary {
                  background: var(--primary);
                  color: var(--primary-ink);
                  border-color: var(--primary)
            }

            .btn.danger {
                  color: var(--bad);
                  border-color: var(--bad)
            }

            .btn.ghost {
                  border-color: transparent;
                  background: transparent
            }

            .btn.sm {
                  padding: 3px 10px;
                  min-height: 30px;
                  font-size: .85rem
            }

            .btn:disabled {
                  opacity: .5;
                  cursor: not-allowed
            }

            input:not([type="checkbox"]),
            select,
            textarea {
                  width: 100%;
                  padding: 8px 10px;
                  border: 1.5px solid var(--line);
                  border-radius: 8px;
                  background: var(--raise);
                  min-height: 38px
            }

            textarea {
                  resize: vertical;
                  min-height: 84px
            }

            input:disabled,
            select:disabled,
            textarea:disabled {
                  opacity: .6
            }

            .field {
                  display: flex;
                  flex-direction: column;
                  gap: 5px;
                  font-weight: 600;
                  font-size: .88rem;
                  min-width: 0
            }

            .field .hint {
                  font-weight: 400;
                  color: var(--ink-2);
                  font-size: .82rem
            }

            .select-btn {
                  appearance: none;
                  -webkit-appearance: none;
                  -moz-appearance: none;
                  min-width: 170px;
                  padding-right: 30px;
                  background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
                  background-position: calc(100% - 16px) calc(50% - 2px), calc(100% - 11px) calc(50% - 2px);
                  background-size: 5px 5px, 5px 5px;
                  background-repeat: no-repeat;
                  background-color: var(--raise)
            }

            .grid2 {
                  display: grid;
                  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
                  gap: 14px
            }

            .filters {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 12px;
                  align-items: flex-end;
                  margin-bottom: 16px
            }

            .filters .field {
                  min-width: 150px
            }

            /* tables */
            .scroll {
                  overflow-x: auto;
                  border: 1px solid var(--line);
                  border-radius: 10px;
                  background: var(--raise)
            }

            .tbl {
                  width: 100%;
                  border-collapse: collapse;
                  min-width: 640px
            }

            .tbl th {
                  text-align: left;
                  font-size: .82rem;
                  color: var(--ink-2);
                  font-weight: 600;
                  padding: 10px 12px;
                  border-bottom: 1px solid var(--line);
                  background: var(--surface);
                  white-space: nowrap
            }

            .tbl td {
                  padding: 10px 12px;
                  border-bottom: 1px solid var(--line-2);
                  vertical-align: middle
            }

            .tbl tr:last-child td {
                  border-bottom: 0
            }

            .tbl .r {
                  text-align: right;
                  white-space: nowrap
            }

            .pager {
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  gap: 10px;
                  padding: 10px 2px;
                  color: var(--ink-2);
                  font-size: .9rem
            }

            .empty {
                  padding: 34px 18px;
                  text-align: center;
                  color: var(--ink-2)
            }

            .empty b {
                  display: block;
                  color: var(--ink);
                  margin-bottom: 4px
            }

            .person {
                  display: flex;
                  align-items: center;
                  gap: 10px
            }

            .avatar {
                  width: 30px;
                  height: 30px;
                  border-radius: 50%;
                  background: var(--line-2);
                  color: var(--ink);
                  display: inline-grid;
                  place-items: center;
                  font-size: .72rem;
                  font-weight: 700;
                  flex: none;
                  overflow: hidden
            }

            .avatar img {
                  width: 100%;
                  height: 100%;
                  object-fit: cover;
                  display: block
            }

            .avatar svg {
                  width: 18px;
                  height: 18px;
                  display: block;
                  color: var(--ink)
            }

            .tabs {
                  display: flex;
                  gap: 4px;
                  border-bottom: 1px solid var(--line);
                  margin-bottom: 16px;
                  overflow-x: auto
            }

            .tab {
                  background: none;
                  border: 0;
                  border-bottom: 3px solid transparent;
                  padding: 10px 14px;
                  font-weight: 600;
                  color: var(--ink-2);
                  cursor: pointer;
                  white-space: nowrap
            }

            .tab[aria-selected="true"] {
                  color: var(--ink);
                  border-bottom-color: var(--signal)
            }

            .tab .count {
                  margin-left: 6px;
                  background: var(--line-2);
                  border-radius: 999px;
                  padding: 1px 8px;
                  font-size: .78rem
            }

            /* badges */
            .badge {
                  display: inline-block;
                  padding: 2px 9px;
                  border-radius: 5px;
                  font-size: .8rem;
                  font-weight: 600;
                  border: 1.5px solid transparent;
                  white-space: nowrap
            }

            .badge.pending {
                  background: var(--warn-bg);
                  color: var(--warn);
                  border: 1.5px dashed var(--warn)
            }

            .badge.approved {
                  background: var(--ok-bg);
                  color: var(--ok)
            }

            .badge.rejected {
                  background: var(--bad-bg);
                  color: var(--bad)
            }

            .badge.late {
                  background: var(--bad-bg);
                  color: var(--bad)
            }

            .badge.ontime {
                  background: var(--ok-bg);
                  color: var(--ok)
            }

            .badge.plain {
                  background: var(--line-2);
                  color: var(--ink)
            }

            .chips {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 6px
            }

            .chip {
                  display: inline-flex;
                  align-items: center;
                  gap: 6px;
                  background: var(--line-2);
                  border-radius: 5px;
                  padding: 2px 8px;
                  font-size: .82rem;
                  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace
            }

            .chip button {
                  background: none;
                  border: 0;
                  cursor: pointer;
                  color: var(--ink-2);
                  padding: 0 2px;
                  font-size: 1rem;
                  line-height: 1
            }

            /* shift tickets: the rota's visual language */
            .ticket {
                  --c: var(--s-am);
                  display: flex;
                  flex-direction: column;
                  gap: 1px;
                  width: 100%;
                  text-align: left;
                  background: var(--raise);
                  border: 1.5px solid var(--line);
                  border-left: 6px solid var(--c);
                  border-radius: 5px;
                  padding: 5px 8px;
                  font-size: .84rem;
                  cursor: default
            }

            button.ticket {
                  cursor: pointer
            }

            button.ticket:hover {
                  border-color: var(--ink-2);
                  border-left-color: var(--c)
            }

            .ticket .t-name {
                  font-weight: 700
            }

            .ticket .t-time {
                  color: var(--ink-2)
            }

            .ticket .t-who {
                  color: var(--ink-2);
                  font-size: .8rem
            }

            .ticket .t-status {
                  font-size: .76rem;
                  font-weight: 600;
                  color: var(--warn)
            }

            .ticket.pending {
                  border-style: dashed;
                  border-left-style: solid;
                  background: var(--surface)
            }

            .ticket.rejected {
                  opacity: .65
            }

            .ticket.rejected .t-name {
                  text-decoration: line-through
            }

            .ticket.rejected .t-status {
                  color: var(--bad)
            }

            .legend {
                  list-style: none;
                  margin: 0;
                  padding: 0;
                  display: flex;
                  flex-wrap: wrap;
                  gap: 6px 16px;
                  font-size: .84rem;
                  color: var(--ink-2)
            }

            .legend li {
                  display: flex;
                  align-items: center;
                  gap: 6px
            }

            .legend i {
                  width: 12px;
                  height: 12px;
                  border-radius: 3px;
                  display: inline-block
            }

            .legend .dashed {
                  border: 1.5px dashed var(--warn);
                  background: transparent
            }

            .week {
                  display: grid;
                  grid-template-columns: repeat(7, minmax(0, 1fr));
                  gap: 1px;
                  background: var(--line);
                  border: 1px solid var(--line);
                  border-radius: 10px;
                  overflow: hidden
            }

            .day {
                  background: var(--surface);
                  min-height: 120px;
                  padding: 8px;
                  display: flex;
                  flex-direction: column;
                  gap: 6px
            }

            .day.today {
                  background: var(--raise);
                  box-shadow: inset 0 3px 0 var(--signal)
            }

            .day h3 {
                  font-size: .86rem;
                  color: var(--ink-2);
                  font-family: "Public Sans", system-ui, sans-serif;
                  font-weight: 600
            }

            .day.today h3 {
                  color: var(--ink)
            }

            @media (max-width:860px) {
                  .week {
                        grid-template-columns: 1fr
                  }

                  .day {
                        min-height: 0
                  }
            }

            .rota {
                  border-collapse: separate;
                  border-spacing: 0;
                  min-width: 900px;
                  width: 100%
            }

            .rota th,
            .rota td {
                  border-bottom: 1px solid var(--line-2);
                  border-right: 1px solid var(--line-2);
                  padding: 6px;
                  vertical-align: top;
                  background: var(--raise)
            }

            .rota th {
                  background: var(--surface);
                  font-size: .82rem;
                  text-align: left;
                  color: var(--ink-2);
                  font-weight: 600
            }

            .rota th.today {
                  box-shadow: inset 0 3px 0 var(--signal);
                  color: var(--ink)
            }

            .rota .who-col {
                  position: sticky;
                  left: 0;
                  z-index: 1;
                  min-width: 160px;
                  background: var(--surface)
            }

            .rota td.cell {
                  min-width: 128px
            }

            .cell-stack {
                  display: flex;
                  flex-direction: column;
                  gap: 5px
            }

            .add {
                  background: none;
                  border: 1.5px dashed var(--line);
                  border-radius: 5px;
                  color: var(--ink-2);
                  cursor: pointer;
                  padding: 3px;
                  font-size: .82rem;
                  width: 100%
            }

            .add:hover {
                  border-color: var(--ink-2);
                  color: var(--ink)
            }

            /* check-in */
            .punch-layout {
                  display: grid;
                  grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
                  gap: 32px;
                  align-items: start
            }

            @media (max-width:860px) {
                  .punch-layout {
                        grid-template-columns: 1fr
                  }
            }

            .punch-main {
                  display: flex;
                  flex-direction: column;
                  gap: 14px;
                  align-items: flex-start
            }

            .clock {
                  font-family: "Bricolage Grotesque", system-ui, sans-serif;
                  font-weight: 800;
                  font-size: clamp(3.6rem, 11vw, 7.5rem);
                  letter-spacing: -.04em;
                  line-height: .95;
                  font-variant-numeric: tabular-nums
            }

            .clock .secs {
                  font-size: .32em;
                  letter-spacing: 0;
                  margin-left: .15em;
                  color: var(--ink-2);
                  font-weight: 600
            }

            .punch {
                  font-family: "Bricolage Grotesque", system-ui, sans-serif;
                  font-weight: 700;
                  font-size: 1.35rem;
                  padding: 16px 38px;
                  border: 2.5px solid var(--ink);
                  background: var(--signal);
                  color: var(--signal-ink);
                  border-radius: 12px;
                  cursor: pointer;
                  box-shadow: 5px 5px 0 var(--shadow);
                  transition: transform .08s, box-shadow .08s
            }

            .punch:hover:not(:disabled) {
                  transform: translate(-1px, -1px);
                  box-shadow: 6px 6px 0 var(--shadow)
            }

            .punch:active:not(:disabled) {
                  transform: translate(4px, 4px);
                  box-shadow: 1px 1px 0 var(--shadow)
            }

            .punch:disabled {
                  background: var(--line-2);
                  color: var(--ink-2);
                  box-shadow: none;
                  border-color: var(--line);
                  cursor: not-allowed
            }

            .panel {
                  border: 1px solid var(--line);
                  border-radius: 10px;
                  background: var(--raise);
                  padding: 16px
            }

            .panel h3 {
                  margin-bottom: 10px
            }

            .kv {
                  display: grid;
                  grid-template-columns: auto 1fr;
                  gap: 6px 16px;
                  font-size: .92rem
            }

            .kv dt {
                  color: var(--ink-2)
            }

            .kv dd {
                  margin: 0;
                  font-weight: 600
            }

            .alert {
                  padding: 10px 14px;
                  border-radius: 8px;
                  font-size: .92rem;
                  border: 1.5px solid
            }

            .alert.bad {
                  background: var(--bad-bg);
                  color: var(--bad);
                  border-color: var(--bad)
            }

            .alert.warn {
                  background: var(--warn-bg);
                  color: var(--warn);
                  border-color: var(--warn)
            }

            .alert.ok {
                  background: var(--ok-bg);
                  color: var(--ok);
                  border-color: var(--ok)
            }

            /* approvals */
            .approval {
                  display: grid;
                  grid-template-columns: minmax(0, 1fr) auto;
                  gap: 12px;
                  align-items: center;
                  padding: 14px 16px;
                  border-bottom: 1px solid var(--line-2)
            }

            .approval:last-child {
                  border-bottom: 0
            }

            .approval .what {
                  display: flex;
                  flex-direction: column;
                  gap: 6px;
                  min-width: 0
            }

            .approval .what .row {
                  gap: 8px
            }

            .approval .ticket {
                  max-width: 240px
            }

            .list {
                  border: 1px solid var(--line);
                  border-radius: 10px;
                  background: var(--raise)
            }

            .store-approval {
                  margin-bottom: 20px;
                  overflow: hidden
            }

            .store-head {
                  display: flex;
                  flex-wrap: wrap;
                  align-items: center;
                  justify-content: space-between;
                  gap: 10px 16px
            }

            .store-approval>.store-head {
                  padding: 14px 16px;
                  background: var(--surface);
                  border-bottom: 1px solid var(--line)
            }

            .week-block {
                  padding: 14px 16px;
                  border-top: 1px solid var(--line-2);
                  display: flex;
                  flex-direction: column;
                  gap: 10px
            }

            .store-approval>.store-head+.week-block {
                  border-top: 0
            }

            .week-block .scroll {
                  border-radius: 8px
            }

            @media (max-width:640px) {
                  .approval {
                        grid-template-columns: 1fr
                  }
            }

            /* dialog + toast */
            .overlay {
                  position: fixed;
                  inset: 0;
                  background: #0a1214b3;
                  display: grid;
                  place-items: center;
                  padding: 16px;
                  z-index: 50;
                  overflow: auto
            }

            .dialog {
                  background: var(--surface);
                  color: var(--ink);
                  border: 1px solid var(--line);
                  border-radius: 12px;
                  width: min(480px, 100%);
                  max-height: calc(100vh - 32px);
                  display: flex;
                  flex-direction: column;
                  outline: none
            }

            .dialog.wide {
                  width: min(640px, 100%)
            }

            .dialog header {
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  gap: 12px;
                  padding: 16px 18px;
                  border-bottom: 1px solid var(--line)
            }

            .dialog-body {
                  padding: 18px;
                  overflow: auto;
                  display: flex;
                  flex-direction: column;
                  gap: 14px
            }

            .dialog footer {
                  padding: 14px 18px;
                  border-top: 1px solid var(--line);
                  display: flex;
                  gap: 10px;
                  justify-content: flex-end;
                  flex-wrap: wrap
            }

            .toasts {
                  position: fixed;
                  bottom: 18px;
                  right: 18px;
                  display: flex;
                  flex-direction: column;
                  gap: 8px;
                  z-index: 60;
                  max-width: calc(100vw - 36px)
            }

            .toast {
                  background: var(--primary);
                  color: var(--primary-ink);
                  padding: 10px 16px;
                  border-radius: 8px;
                  font-weight: 600;
                  box-shadow: 0 6px 20px #0004
            }

            .toast.error {
                  background: var(--bad);
                  color: #fff
            }

            /* login */
            .login {
                  min-height: 100vh;
                  display: grid;
                  grid-template-columns: 1.1fr 1fr
            }

            .login-art {
                  background: var(--side);
                  color: var(--side-ink);
                  padding: clamp(24px, 5vw, 64px);
                  display: flex;
                  flex-direction: column;
                  justify-content: space-between;
                  gap: 32px
            }

            .login-art h1 {
                  font-size: clamp(2.2rem, 5vw, 3.8rem);
                  font-weight: 800;
                  max-width: 14ch;
                  letter-spacing: -.03em
            }

            .login-art .ticket {
                  background: #ffffff0d;
                  border-color: #ffffff26;
                  border-left-color: var(--c);
                  color: var(--side-ink);
                  max-width: 300px
            }

            .login-art .ticket .t-time {
                  color: var(--side-mute)
            }

            .key {
                  display: grid;
                  gap: 8px
            }

            .login-form {
                  padding: clamp(24px, 5vw, 64px);
                  display: flex;
                  flex-direction: column;
                  justify-content: center;
                  gap: 16px;
                  max-width: 460px;
                  width: 100%;
                  margin: 0 auto
            }

            .demo-list {
                  display: grid;
                  grid-template-columns: 1fr 1fr;
                  gap: 8px
            }

            .demo-list .btn {
                  flex-direction: column;
                  align-items: flex-start;
                  gap: 0;
                  text-align: left;
                  font-weight: 600
            }

            .demo-list small {
                  font-weight: 400;
                  color: var(--ink-2)
            }

            @media (max-width:860px) {
                  .login {
                        grid-template-columns: 1fr
                  }

                  .login-art {
                        gap: 20px
                  }
            }
      </style>
</head>

                        return html`<div className="page-head"><div><h1>${p.title}</h1>${p.sub && html`<p className="muted">${p.sub}</p>`}</div>${p.children && html`<div className="row">${p.children}</div>`}</div>`;
                  }
                  function Empty(p) { return html`<div className="empty"><b>${p.title || "Nothing here yet"}</b>${p.text && html`<span>${p.text}</span>`}</div>`; }
                  function ErrorBox(p) { return html`<div className="alert bad" role="alert">${msgOf(p.error)} ${p.retry && html`<button type="button" className="btn sm" onClick=${p.retry}>Try again</button>`}</div>`; }
                  function Field(p) { return html`<label className="field"><span>${p.label}</span>${p.children}${p.hint && html`<span className="hint">${p.hint}</span>`}</label>`; }
                  function StatusBadge(p) { return html`<span className=${"badge " + String(p.status).toLowerCase()}>${p.status}</span>`; }
                  function Avatar(p) {
                        var hasImage = !!(p.image && p.image.trim() && p.image !== "null" && p.image !== "undefined");
                        return html`<span className="avatar" aria-hidden="true">${hasImage ? html`<img src=${p.image} alt="" />` : html`<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 12c2.76 0 5-2.24 5-5S14.76 2 12 2 7 4.24 7 7s2.24 5 5 5Zm-7 8c0-2.9 3.1-5 7-5s7 2.1 7 5v1H5v-1Z" fill="currentColor"/></svg>`}</span>`;
                  }
                  function Person(p) {
                        var name = personName({ displayName: p.name, username: p.username, email: p.email, userName: p.userName, name: p.name });
                        return html`<span className="person"><${Avatar} name=${name} image=${p.image}/><span>${name}${p.sub && html`<br/><small className="muted">${p.sub}</small>`}</span></span>`;
                  }

                  function Legend(p) {
                        return html`<ul className="legend" aria-label="Shift colours">${SHIFT_KEYS.map(function (k) { return html`<li key=${k}><i style=${{ background: "var(" + SHIFTS[k].v + ")" }}></i>${SHIFTS[k].label}</li>`; })}
    ${p.pending && html`<li><i className="dashed"></i>Dashed outline: waiting for approval</li>`}</ul>`;
                  }
                  function Ticket(p) {
                        var s = p.s, m = SHIFTS[s.shiftType], leave = isLeave(s.shiftType);
                        var inner = html`<span className="t-name">${m.label}</span><span className="t-time">${leave ? "All day" : hm(s.startTime) + "–" + hm(s.endTime)}</span>${p.who && html`<span className="t-who">${p.who}</span>`}${s.status !== "Approved" && !p.hideStatus && html`<span className="t-status">${s.status === "Pending" ? "Awaiting approval" : "Rejected"}</span>`}`;
                        var cls = cx("ticket", s.status.toLowerCase()), st = { "--c": "var(" + m.v + ")" };
                        return p.onClick ? html`<button type="button" className=${cls} style=${st} onClick=${p.onClick}>${inner}</button>` : html`<div className=${cls} style=${st}>${inner}</div>`;
                  }
                  function Modal(p) {
                        var ref = useRef(null);
                        useEffect(function () {
                              var prev = document.activeElement; if (ref.current) ref.current.focus();
                              var k = function (e) { if (e.key === "Escape") p.onClose(); };
                              document.addEventListener("keydown", k);
                              return function () { document.removeEventListener("keydown", k); if (prev && prev.focus) prev.focus(); };
                        }, []);
                        return html`<div className="overlay" onMouseDown=${function (e) { if (e.target === e.currentTarget) p.onClose(); }}>
    <div className=${cx("dialog", p.wide && "wide")} role="dialog" aria-modal="true" aria-label=${p.title} tabIndex="-1" ref=${ref}>
      <header><h2>${p.title}</h2><button type="button" className="btn ghost sm" onClick=${p.onClose}>Close</button></header>
      <div className="dialog-body">${p.children}</div>
      ${p.footer && html`<footer>${p.footer}</footer>`}
    </div></div>`;
                  }
                  function Confirm(p) {
                        return html`<${Modal} title=${p.title} onClose=${p.onCancel} footer=${html`<button type="button" className="btn" onClick=${p.onCancel}>Cancel</button><button type="button" className=${cx("btn", p.danger ? "danger" : "primary")} onClick=${p.onConfirm} disabled=${p.busy}>${p.confirmLabel}</button>`}><p>${p.body}</p><//>`;
                  }
                  function Pager(p) {
                        var a = (p.page - 1) * p.pageSize + 1, b = Math.min(p.total, p.page * p.pageSize);
                        return html`<div className="pager"><span>${p.total ? a + "–" + b + " of " + p.total : "No results"}</span><span className="row">
    <button type="button" className="btn sm" disabled=${p.page <= 1} onClick=${function () { p.onPage(p.page - 1); }}>Previous</button>
    <button type="button" className="btn sm" disabled=${b >= p.total} onClick=${function () { p.onPage(p.page + 1); }}>Next</button></span></div>`;
                  }
                  function DataTable(p) {
                        var rows = p.rows || [];
                        return html`<div>
    <div className="scroll"><table className="tbl">
      <thead><tr>${p.cols.map(function (c) { return html`<th key=${c.h} className=${c.cls}>${c.h}</th>`; })}</tr></thead>
      <tbody>${rows.map(function (r) { return html`<tr key=${r.id}>${p.cols.map(function (c) { return html`<td key=${c.h} className=${c.cls}>${c.render(r)}</td>`; })}</tr>`; })}</tbody>
    </table>
    ${!p.loading && rows.length === 0 && html`<${Empty} title=${p.emptyTitle} text=${p.empty}/>`}
    ${p.loading && rows.length === 0 && html`<p className="muted pad">Loading…</p>`}
    </div>
    ${p.onPage && p.total > 0 && html`<${Pager} page=${p.page} pageSize=${p.pageSize} total=${p.total} onPage=${p.onPage}/>`}
  </div>`;
                  }
                  function Tabs(p) {
                        return html`<div className="tabs" role="tablist">${p.tabs.map(function (t) { return html`<button type="button" role="tab" key=${t.id} className="tab" aria-selected=${p.value === t.id} onClick=${function () { p.onChange(t.id); }}>${t.label}${t.count != null && html`<span className="count">${t.count}</span>`}</button>`; })}</div>`;
                  }

                  /* providers */
                  function ToastProvider(p) {
                        var st = useState([]), list = st[0], setList = st[1];
                        var push = useCallback(function (text, kind) {
                              var id = Math.random(); setList(function (l) { return l.concat([{ id: id, text: text, kind: kind }]); });
                              setTimeout(function () { setList(function (l) { return l.filter(function (x) { return x.id !== id; }); }); }, 3800);
                        }, []);
                        return html`<${ToastCtx.Provider} value=${push}>${p.children}<div className="toasts" role="status" aria-live="polite">${list.map(function (t) { return html`<div key=${t.id} className=${cx("toast", t.kind === "error" && "error")}>${t.text}</div>`; })}</div><//>`;
                  }
                  function RouterProvider(p) {
                        var st = useState(function () { try { return location.hash.slice(1); } catch (e) { return ""; } }), path = st[0], setPath = st[1];
                        useEffect(function () { var f = function () { try { setPath(location.hash.slice(1)); } catch (e) { } }; window.addEventListener("hashchange", f); return function () { window.removeEventListener("hashchange", f); }; }, []);
                        var go = useCallback(function (to) { setPath(to); try { if (location.hash.slice(1) !== to) location.hash = to; } catch (e) { } }, []);
                        return html`<${RouterCtx.Provider} value=${{ path: path, go: go }}>${p.children}<//>`;
                  }
                  function RouteReset(p) {
                        var r = useRouter();
                        useEffect(function () { if (p.gen > 0) r.go(""); }, [p.gen]);
                        return null;
                  }
                  function DirProvider(p) {
                        var st = useState({ users: [], stores: [], ready: false }), d = st[0], setD = st[1];
                        var load = useCallback(async function () {
                              var r = await Promise.all([api.users.list({ pageSize: 200 }), api.stores.list({ pageSize: 100 })]);
                              setD({ users: r[0].items, stores: r[1].items, ready: true });
                        }, []);
                        useEffect(function () { load().catch(function () { setD(function (x) { return Object.assign({}, x, { ready: true }); }); }); }, []);
                        var value = useMemo(function () {
                              return {
                                    users: d.users, stores: d.stores, reload: load,
                                    userName: function (id) { var u = d.users.find(function (x) { return x.id === id; }); return personName(u); },
                                    storeName: function (id) { var s = d.stores.find(function (x) { return x.id === id; }); return s ? s.name : "–"; }
                              };
                        }, [d, load]);
                        if (!d.ready) return html`<div className="boot">Loading…</div>`;
                        return html`<${DirCtx.Provider} value=${value}>${p.children}<//>`;
                  }

                  /* =====================================================================
                     STAFF PAGES
                     ===================================================================== */
                  function CheckInPage() {
                        var auth = useAuth(), user = auth.user, dir = useDir(), toast = useToast();
                        var now = useNow(), day = workDay(now);
                        var store = dir.stores.find(function (s) { return s.id === user.storeId; });
                        var sched = useQuery(function () { return api.schedules.list({ staffId: user.id, from: day, to: day, pageSize: 10 }); }, [user.id, day]);
                        var att = useQuery(function () { return api.attendance.mine({ from: day, to: iso(addDays(parseISO(day), 1)), pageSize: 20 }); }, [user.id, day]);
                        var sm = useState("ok"), sim = sm[0], setSim = sm[1];
                        var deviceState = useState(readStoredDeviceMac() || ((store && store.deviceMacs && store.deviceMacs[0]) || "")), deviceMac = deviceState[0], setDeviceMac = deviceState[1];
                        var bs = useState(false), busy = bs[0], setBusy = bs[1];
                        var es = useState(""), err = es[0], setErr = es[1];
                        var agent = hasAgent(), canRead = agent || CONFIG.USE_MOCK || !!deviceMac.trim();
                        var todays = items(att).filter(function (r) { return r.checkInTime && workDay(new Date(r.checkInTime)) === day; });
                        var rec = todays.find(function (r) { return !r.checkOutTime; }) || todays[0];
                        var phase = !rec ? "idle" : rec.checkOutTime ? "done" : "in";
                        var syncing = att.loading, blocked = busy || syncing || !!att.error || phase === "done" || !canRead;
                        var label = phase === "done" ? "Checked out" : (busy || syncing) ? (att.data ? "Working…" : "Loading…") : phase === "idle" ? "Check in" : "Check out";
                        var shift = items(sched).find(function (s) { return s.status === "Approved"; });
                        async function punch() {
                              setBusy(true); setErr("");
                              try {
                                    var info = await readNetwork(sim, store, user, deviceMac);
                                    if (!info || !info.deviceMac || !info.deviceMac.trim() || info.deviceMac === "00:00:00:00:00:00") {
                                          throw new Error("No valid device MAC was found. Enter this PC's registered device MAC first.");
                                    }
                                    console.log("Attendance network info:", {
                                          deviceMac: info.deviceMac,
                                          storeId: store && store.id,
                                          userId: user && user.id
                                    });
                                    if (phase === "idle") { await api.attendance.checkIn({ deviceMac: info.deviceMac }); toast("Checked in", "ok"); }
                                    else { await api.attendance.checkOut({ deviceMac: info.deviceMac }); toast("Checked out", "ok"); }
                                    att.refetch();
                              } catch (e) { setErr(e.message === "NO_AGENT" ? "This browser can't read the device details needed to attend." : msgOf(e)); att.refetch(); }
                              finally { setBusy(false); }
                        }
                        return html`<section>
    <${PageHeader} title="Attend" sub=${store ? store.name : ""}/>
    <div className="punch-layout">
      <div className="punch-main">
        <div className="clock">${pad(now.getHours())}:${pad(now.getMinutes())}<span className="secs">${pad(now.getSeconds())}</span></div>
        <p className="muted">${now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })}</p>
                        <button type="button" className="punch" disabled=${blocked} onClick=${punch}>${label}</button>
        ${att.error && html`<${ErrorBox} error=${att.error} retry=${att.refetch}/>`}
        ${err && html`<p className="alert bad" role="alert">${err}</p>`}
        ${!canRead && html`<div className="alert warn"><b>Attendance needs this PC's device info.</b> Install a PC agent, or enter this PC's registered device MAC below before attending.</div>`}
        ${!agent && !CONFIG.USE_MOCK && html`<div className="panel"><h3>Store device</h3><${Field} label="Device MAC" hint="This PC's MAC, as registered by your Admin"><input value=${deviceMac} onChange=${function (e) { var value = e.target.value; setDeviceMac(value); saveStoredDeviceMac(value); }} placeholder="AA:BB:CC:DD:EE:FF" /></${Field}></div>`}
      </div>
      <div className="stack">
        <div className="panel"><h3>Today's shift</h3>
          ${sched.loading && !sched.data ? html`<p className="muted">Loading…</p>` : shift ? html`<${Ticket} s=${shift}/>` : html`<p className="muted">No approved shift today.</p>`}
        </div>
        <div className="panel"><h3>Today's record</h3>
          ${!rec ? html`<p className="muted">You haven't checked in yet.</p>` : html`<dl className="kv">
            <dt>Checked in</dt><dd>${clockOf(rec.checkInTime)} ${rec.isLate ? html`<span className="badge late">Late</span>` : html`<span className="badge ontime">On time</span>`}</dd>
            <dt>Checked out</dt><dd>${clockOf(rec.checkOutTime)}</dd>
            <dt>Time on shift</dt><dd>${dur(rec.checkInTime, rec.checkOutTime || now.toISOString())}</dd></dl>`}
          ${phase === "done" && html`<p className="muted" style=${{ marginTop: "8px" }}>You're done for today. This resets at ${pad(CONFIG.DAY_ROLLOVER_HOUR)}:00 and you can check in again.</p>`}
        </div>
        ${CONFIG.USE_MOCK && !agent && html`<div className="panel"><h3>Simulated store PC</h3>
          <${Field} label="Network this PC is on" hint="Demo only. A real attendance punch reads this from the PC agent.">
            <select value=${sim} onChange=${function (e) { setSim(e.target.value); }}>
              <option value="ok">Registered PC</option>
              <option value="device">Unregistered PC</option>
            </select></${Field}></div>`}
      </div>
    </div></section>`;
                  }

                  function WeekNav(p) {
                        var days = range(iso(p.start), iso(addDays(p.start, 6)));
                        return html`<div className="row"><button type="button" className="btn sm" onClick=${function () { p.onChange(addDays(p.start, -7)); }}>Previous week</button>
    <button type="button" className="btn sm" onClick=${function () { p.onChange(startOfWeek(new Date())); }}>This week</button>
    <button type="button" className="btn sm" onClick=${function () { p.onChange(addDays(p.start, 7)); }}>Next week</button>
    <strong>${fmtShort(days[0])} – ${fmtDate(days[6])}</strong></div>`;

                  function MyAttendancePage() {
                        var user = useAuth().user;
                        var fs = useState({ from: iso(addDays(new Date(), -30)), to: today() }), f = fs[0], setF = fs[1];
                        var pg = useState(1), page = pg[0], setPage = pg[1];
                        var q = useQuery(function () { return api.attendance.mine({ from: f.from, to: f.to, page: page, pageSize: 12 }); }, [f.from, f.to, page]);

    <div className="filters">

      <${Field} label="To"><input type="date" value=${f.to} onChange=${function (e) { setPage(1); setF({ from: f.from, to: e.target.value }); }}/></${Field}>
    </div>
    ${q.error && html`<${ErrorBox} error=${q.error} retry=${q.refetch}/>`}
    <${DataTable} cols=${cols} rows=${d.items} loading=${q.loading} page=${page} pageSize=${d.pageSize || 12} total=${d.totalCount} onPage=${setPage} emptyTitle="No attendance in this range" empty="Try a wider date range."/>
  </section>`;
                  }

                  function RequestModal(p) {
                        var auth = useAuth(), user = auth.user, dir = useDir(), toast = useToast();
                        var fm = useBind({ kind: "request", type: "Exception", staffId: user.id, dateFrom: today(), dateTo: today(), reason: "" }), v = fm[0], bind = fm[2];
                        var bs = useState(false), busy = bs[0], setBusy = bs[1];
                        var es = useState(""), err = es[0], setErr = es[1];
                        var people = user.role === "StoreManager" ? dir.users.filter(function (u) { return u.storeId === user.storeId; }) : [];
                        async function submit() {
                              if (!v.reason.trim()) { setErr("Add a reason so your approver has context."); return; }
                              if (v.dateTo < v.dateFrom) { setErr("The end date can't be before the start date."); return; }
                              setBusy(true); setErr("");
                              try {
                                    if (v.kind === "request") await api.requests.create({ staffId: v.staffId, type: v.type, dateFrom: v.dateFrom, dateTo: v.dateTo, reason: v.reason.trim() });
                                    else await api.missions.create({ staffId: v.staffId, reason: v.reason.trim(), dateFrom: v.dateFrom, dateTo: v.dateTo });
                                    toast(v.kind === "request" ? "Request sent" : "Mission sent", "ok"); p.onDone(v.kind);
                              } catch (e) { setErr(msgOf(e)); } finally { setBusy(false); }
                        }
                        return html`<${Modal} title="New request" onClose=${p.onClose} footer=${html`<button type="button" className="btn" onClick=${p.onClose}>Cancel</button><button type="button" className="btn primary" onClick=${submit} disabled=${busy}>${busy ? "Sending…" : "Send for approval"}</button>`}>
    <div className="grid2">

    </div>
    ${people.length > 0 && html`<${Field} label="For"><select ...${bind("staffId")}>${people.map(function (u) { return html`<option key=${u.id} value=${u.id}>${u.displayName}</option>`; })}</select></${Field}>`}
    <div className="grid2">
      <${Field} label="From"><input type="date" ...${bind("dateFrom")}/></${Field}>
      <${Field} label="To"><input type="date" ...${bind("dateTo")}/></${Field}>
    </div>
    <${Field} label="Reason"><textarea ...${bind("reason")}></textarea></${Field}>
    ${v.kind === "request" && ["Annual", "SickLeave", "OfficialHoliday"].indexOf(v.type) >= 0 && html`<p className="muted">Once approved, these dates are added to the schedule automatically.</p>`}
    ${err && html`<p className="alert bad" role="alert">${err}</p>`}
  <//>`;

                  function RequestsPage() {
                        var user = useAuth().user, dir = useDir();
                        var ts = useState("requests"), tab = ts[0], setTab = ts[1];
                        var pg = useState(1), page = pg[0], setPage = pg[1];
                        var ss = useState(""), status = ss[0], setStatus = ss[1];

    ${q.error && html`<${ErrorBox} error=${q.error} retry=${q.refetch}/>`}

    ${open && html`<${RequestModal} onClose=${function () { setOpen(false); }} onDone=${function (kind) { setOpen(false); setTab(kind === "request" ? "requests" : "missions"); setPage(1); q.refetch(); }}/>`}
  </section>`;

                  /* =====================================================================
                     MANAGER PAGES
                     ===================================================================== */
                  function useStoreScope() {
                        var user = useAuth().user, dir = useDir();
                        var stores = user.role === "Admin" ? dir.stores : user.role === "AreaManager" ? dir.stores.filter(function (s) { return s.areaManagerId === user.id; }) : dir.stores.filter(function (s) { return s.id === user.storeId; });
                        return stores;
                  }

                  async function bulkDecide(verb, ids, reason) {
                        var res = await Promise.allSettled(ids.map(function (id) { return api.schedules[verb](id, reason); }));
                        var ok = res.filter(function (r) { return r.status === "fulfilled"; }).length;
                        var first = res.find(function (r) { return r.status === "rejected"; });
                        return { ok: ok, total: ids.length, error: first ? msgOf(first.reason) : null };

                  function StoreApprovalCard(p) {

          <span className="row">
            <button type="button" className="btn sm danger" disabled=${p.busy} onClick=${function () { p.onAsk("reject", ids(ws), p.name, plural(ws.length, "pending shift") + " in " + label); }}>Reject week</button>
            <button type="button" className="btn sm primary" disabled=${p.busy} onClick=${function () { p.onAsk("approve", ids(ws), p.name, plural(ws.length, "pending shift") + " in " + label); }}>Approve week</button>

                  function ApprovalsPage() {
                        var dir = useDir(), toast = useToast();
                        var ts = useState("schedules"), tab = ts[0], setTab = ts[1];
                        var bs = useState(null), busyId = bs[0], setBusyId = bs[1];
                        var cs = useState(null), confirm = cs[0], setConfirm = cs[1];
                        var rs = useState(null), review = rs[0], setReview = rs[1];
                        var qs = {
                              schedules: useQuery(function () { return api.schedules.pending({ pageSize: 500 }); }, []),
                              requests: useQuery(function () { return api.requests.pending({ pageSize: 100 }); }, []),
                              missions: useQuery(function () { return api.missions.pending({ pageSize: 100 }); }, [])
                        };
                        var cnt = function (k) { return qs[k].data ? qs[k].data.totalCount : 0; };
                        async function decide(kind, id, verb) {
                              var reason = null;
                              if (verb === "reject") { reason = window.prompt("Reason for rejecting this " + kind.slice(0, -1) + ":", ""); if (reason == null) return; if (!reason.trim()) { toast("A rejection reason is required.", "error"); return; } }
                              setBusyId(id);
                              try { await api[kind][verb](id, reason); toast(verb === "approve" ? "Approved" : "Rejected", "ok"); qs[kind].refetch(); }
                              catch (e) { toast(msgOf(e), "error"); } finally { setBusyId(null); }
                        }
                        function ask(verb, ids, storeName, scope) {
                              setConfirm({ verb: verb, ids: ids, title: (verb === "approve" ? "Approve " : "Reject ") + ids.length + " shift" + (ids.length === 1 ? "" : "s") + "?", body: (verb === "approve" ? "Approve " : "Reject ") + scope + " for " + storeName + "?" });
                        }
                        async function runBulk() {
                              var reason = null;
                              if (confirm.verb === "reject") { reason = window.prompt("Reason for rejecting these shifts:", ""); if (reason == null) { setConfirm(null); return; } if (!reason.trim()) { toast("A rejection reason is required.", "error"); setConfirm(null); return; } }
                              setBusyId("bulk");
                              var r = await bulkDecide(confirm.verb, confirm.ids, reason);
                              bulkToast(toast, confirm.verb, r); setConfirm(null); setBusyId(null); qs.schedules.refetch();
                        }
                        var list = items(qs[tab]);
                        var groups = [];
                        if (tab === "schedules") {
                              var by = {};
                              list.forEach(function (x) {
                                    var st = (dir.users.find(function (u) { return u.id === x.staffId; }) || {}).storeId || "none";
                                    (by[st] = by[st] || []).push(x);
                              });
                              groups = Object.keys(by).map(function (k) { return { id: k, name: k === "none" ? "No store" : dir.storeName(k), list: by[k] }; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
                        }
                        var buttons = function (kind, id) { return html`<span className="row"><button type="button" className="btn danger" disabled=${busyId === id} onClick=${function () { decide(kind, id, "reject"); }}>Reject</button><button type="button" className="btn primary" disabled=${busyId === id} onClick=${function () { decide(kind, id, "approve"); }}>Approve</button></span>`; };
                        var showList = tab !== "schedules" && list.length > 0;
                        return html`<section><${PageHeader} title="Approvals" sub=${tab === "schedules" ? "Approve a whole store, or one week at a time. Click any shift to review it on its own." : "Everything waiting on you."}/>
    <${Tabs} value=${tab} onChange=${setTab} tabs=${[{ id: "schedules", label: "Schedules", count: cnt("schedules") }, { id: "requests", label: "Requests", count: cnt("requests") }, { id: "missions", label: "Missions", count: cnt("missions") }]}/>
    ${qs[tab].error && html`<${ErrorBox} error=${qs[tab].error} retry=${qs[tab].refetch}/>`}
    ${qs[tab].loading && !qs[tab].data && html`<p className="muted">Loading…</p>`}
    ${!qs[tab].loading && list.length === 0 && html`<div className="list"><${Empty} title="You're all caught up" text=${"No " + tab + " are waiting for approval."}/></div>`}
    ${groups.map(function (g) { return html`<${StoreApprovalCard} key=${g.id} name=${g.name} list=${g.list} dir=${dir} busy=${busyId === "bulk"} onAsk=${ask} onOpen=${setReview}/>`; })}
    ${showList && html`<div className="list">${list.map(function (r) {
                              return html`<div key=${r.id} className="approval"><div className="what"><div className="row"><${Person} name=${dir.userName(r.staffId)}/>${r.type && html`<span className="badge plain">${REQ_TYPES[r.type] || r.type}</span>`}<strong>${r.dateFrom === r.dateTo ? fmtDate(r.dateFrom) : fmtShort(r.dateFrom) + " – " + fmtDate(r.dateTo)}</strong></div><p>${r.reason}</p>${r.requestedById && r.requestedById !== r.staffId && html`<small className="muted">Requested by ${dir.userName(r.requestedById)}</small>`}</div>${buttons(tab, r.id)}</div>`;
                        })}</div>`}
    ${confirm && html`<${Confirm} title=${confirm.title} body=${confirm.body} danger=${confirm.verb === "reject"} confirmLabel=${confirm.verb === "approve" ? "Approve" : "Reject"} busy=${busyId === "bulk"} onCancel=${function () { setConfirm(null); }} onConfirm=${runBulk}/>`}
    ${review && html`<${ScheduleModal} sched=${review} staffId=${review.staffId} date=${review.date} settings=${null} canEdit=${false} canReview=${true} canDelete=${false} onClose=${function () { setReview(null); }} onDone=${function () { setReview(null); qs.schedules.refetch(); }}/>`}
  </section>`;
                  }

        <div className="demo-list">${DEMO.map(function (d) { return html`<button type="button" key=${d.u} className="btn" disabled=${busy} onClick=${function () { go(d.u, "demo"); }}>${d.label}<small>${d.sub}</small></button>`; })}</div></div>`

    </div>
  </div>`;

                  function App() {
                        var us = useState(null), user = us[0], setUser = us[1];
                        var gs = useState(0), gen = gs[0], setGen = gs[1];
                        var bs = useState(!CONFIG.USE_MOCK), booting = bs[0], setBooting = bs[1];
                        useEffect(function () {
                              session.onExpire = function () { clearSession(); setUser(null); };
                              if (CONFIG.USE_MOCK) return;
                              loadSession();
                              var c = session.token ? decodeJwt(session.token) : {};
                              if (c.id) api.users.get(c.id).then(setUser).catch(clearSession).then(function () { setBooting(false); });
                              else setBooting(false);
                        }, []);
                        var value = useMemo(function () {
                              return {
                                    user: user,
                                    logout: function () { clearSession(); setUser(null); setGen(function (g) { return g + 1; }); },
                                    switchTo: function (username) { api.login(username, "demo").then(function (u) { setUser(u); setGen(function (g) { return g + 1; }); }); }
                              };
                        }, [user]);
                        var login = async function (u, pw) { var x = await api.login(u, pw); setUser(x); setGen(function (g) { return g + 1; }); };
                        if (booting) return html`<div className="boot">Loading…</div>`;
                        return html`<${ToastProvider}><${RouterProvider}><${AuthCtx.Provider} value=${value}><${RouteReset} gen=${gen}/>
    ${user ? html`<${DirProvider} key=${user.id}><${Shell}/><//>` : html`<${Login} onLogin=${login}/>`}
